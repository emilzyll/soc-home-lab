title: PowerShell Encoded Command Execution
id: 6f1b2c9e-3a47-4d8a-9c55-2e7a1d0b4f10
status: experimental
description: Detects PowerShell started with an encoded command argument
author: <your name>
date: 2026/10/18
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand '
    condition: selection_img and selection_cli
falsepositives:
    - Administrative scripts and software deployment tools
level: medium
